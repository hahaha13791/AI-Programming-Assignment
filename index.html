<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen to the world</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app" id="app" data-mode="melody">
    <header class="app-header">
      <h1>Listen to the world</h1>
      <p class="subtitle" id="subtitle">기준음을 듣고, 멜로디를 오선에 받아 적어 보세요.</p>
    </header>

    <div class="mode-tabs" role="tablist" aria-label="연습 모드">
      <button type="button" class="mode-tab" role="tab" aria-selected="true" data-mode="melody">멜로디</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="harmony">화성</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="rhythm">리듬</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="score">내 악보</button>
    </div>

    <section class="panel" aria-labelledby="difficulty-title">
      <div class="panel-head">
        <h2 id="difficulty-title">난이도</h2>
        <div class="chord-types" role="radiogroup" aria-label="화음 종류" id="chord-types" hidden>
          <button type="button" class="chord-type" role="radio" aria-checked="true" data-type="triad">3화음</button>
          <button type="button" class="chord-type" role="radio" aria-checked="false" data-type="seventh">7화음</button>
        </div>
        <p class="score-notice" id="score-notice" role="status" hidden></p>
        <button type="button" class="btn-settings" id="btn-settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings" aria-label="설정">⚙&#xFE0E;</button>
        <div class="settings" id="settings" role="dialog" aria-labelledby="settings-title" hidden>
          <h3 class="settings-title" id="settings-title">설정</h3>
          <fieldset class="settings-group" id="settings-instrument">
            <legend>악기 (모든 모드)</legend>
            <label><input type="radio" name="instrument" value="piano"> 피아노</label>
            <label><input type="radio" name="instrument" value="violin"> 바이올린</label>
            <label><input type="radio" name="instrument" value="flute"> 플루트</label>
            <label><input type="radio" name="instrument" value="marimba"> 마림바</label>
            <label><input type="radio" name="instrument" value="harp"> 하프</label>
            <p class="settings-note" id="settings-instrument-status" aria-live="polite"></p>
          </fieldset>
          <fieldset class="settings-group" id="settings-speed">
            <legend>빠르기</legend>
            <label><input type="radio" name="speed" value="1"> 원래 빠르기</label>
            <label><input type="radio" name="speed" value="0.75"> 느리게 (75%)</label>
            <label><input type="radio" name="speed" value="0.5"> 아주 느리게 (50%)</label>
          </fieldset>
          <fieldset class="settings-group" id="settings-solfege">
            <legend>계이름</legend>
            <label><input type="radio" name="solfege" value="movable"> 이동도 (으뜸음 = 도·라)</label>
            <label><input type="radio" name="solfege" value="fixed"> 고정도 (C = 도)</label>
          </fieldset>
          <fieldset class="settings-group" id="settings-line" hidden>
            <legend>화음에서 받아 적는 음 (이 악보)</legend>
            <label><input type="radio" name="line" value="top"> 맨 위 음 (선율)</label>
            <label><input type="radio" name="line" value="bottom"> 맨 아래 음 (베이스)</label>
          </fieldset>
          <p class="settings-credit" id="settings-credit">피아노 녹음: Salamander Grand Piano (Alexander Holm, CC BY 3.0) · 바이올린·플루트·마림바·하프: VSCO 2 CE (Versilian Studios, CC0)</p>
        </div>
        <!-- 내 악보 [새 악보]: 직접 만들기 or 파일 불러오기 (MusicXML), in a small box like ⚙'s. -->
        <div class="settings new-score" id="new-score" role="dialog" aria-labelledby="new-score-title" hidden>
          <h3 class="settings-title" id="new-score-title">새 악보</h3>
          <div class="new-score-choices">
            <button type="button" class="btn btn-small" id="btn-make-score">직접 만들기</button>
            <button type="button" class="btn btn-small" id="btn-import-file">파일 불러오기</button>
          </div>
          <input type="file" id="import-file" accept=".musicxml,.xml,.mxl" hidden>
          <div class="import" id="import" hidden>
            <p class="import-file" id="import-file-name"></p>
            <p class="import-status" id="import-status" role="status"></p>
            <fieldset class="settings-group import-list" id="import-parts" hidden>
              <legend>파트</legend>
            </fieldset>
            <fieldset class="settings-group import-list" id="import-lines" hidden>
              <legend>보표·성부</legend>
            </fieldset>
            <p class="import-note" id="import-skipped" hidden></p>
            <div class="import-actions">
              <button type="button" class="btn btn-small" id="btn-import-other">다른 파일</button>
              <button type="button" class="btn btn-small btn-primary" id="btn-import" disabled>불러오기</button>
            </div>
          </div>
        </div>
      </div>
      <div class="level-area">
        <div class="difficulty" role="radiogroup" aria-label="난이도 선택">
          <button type="button" class="difficulty-option" role="radio" aria-checked="true" data-level="easy">
            <span class="difficulty-name">쉬움</span>
            <span class="difficulty-desc">3~4음</span>
          </button>
          <button type="button" class="difficulty-option" role="radio" aria-checked="false" data-level="medium">
            <span class="difficulty-name">중간</span>
            <span class="difficulty-desc">5~6음</span>
          </button>
          <button type="button" class="difficulty-option" role="radio" aria-checked="false" data-level="hard">
            <span class="difficulty-name">어려움</span>
            <span class="difficulty-desc">7~8음</span>
          </button>
        </div>
        <!-- 내 악보: drawn over the difficulty buttons, which stay in place (invisible) to keep the panel's height. -->
        <div class="score-picker" id="score-picker" hidden>
          <div class="score-row">
            <select class="score-select" id="score-select" aria-label="악보 고르기"></select>
            <button type="button" class="btn btn-small" id="btn-new-score" aria-haspopup="dialog" aria-expanded="false" aria-controls="new-score">새 악보</button>
            <button type="button" class="btn btn-small" id="btn-edit-score">편집</button>
          </div>
          <div class="section-chips length-chips" id="length-chips" role="radiogroup" aria-label="구간 길이">
            <button type="button" class="section-chip" role="radio" aria-checked="false" data-length="1">1마디</button>
            <button type="button" class="section-chip" role="radio" aria-checked="true" data-length="2">2마디</button>
            <button type="button" class="section-chip" role="radio" aria-checked="false" data-length="4">4마디</button>
            <button type="button" class="section-chip" role="radio" aria-checked="false" data-length="custom">직접</button>
            <span class="strip-hint" id="strip-hint" aria-live="polite"></span>
          </div>
          <div class="score-strip" id="score-strip"></div>
        </div>
      </div>
    </section>

    <!-- 내 악보 editor (PRD #4-H): takes the place of the listening, writing and result panels while open. -->
    <section class="panel editor" id="editor" aria-labelledby="editor-heading" hidden>
      <h2 id="editor-heading">악보 편집</h2>
      <label class="editor-title">
        <span class="editor-label">제목</span>
        <input type="text" id="editor-title" maxlength="100" placeholder="악보 제목" autocomplete="off" aria-describedby="editor-title-note">
      </label>
      <p class="editor-title-note" id="editor-title-note" aria-live="polite"></p>
      <div class="editor-view" id="editor-view"></div>
      <p class="editor-status" id="editor-status" aria-live="polite"></p>
      <div class="editor-history">
        <button type="button" class="btn" id="editor-undo">되돌리기</button>
        <button type="button" class="btn" id="editor-redo">다시 하기</button>
        <button type="button" class="btn" id="editor-play">듣기</button>
      </div>
      <div class="editor-tabs" id="editor-tabs" role="tablist" aria-label="편집 도구">
        <button type="button" role="tab" id="editor-tab-notes" data-tab="notes" aria-controls="editor-tool-notes" aria-selected="true">음표</button>
        <button type="button" role="tab" id="editor-tab-measure" data-tab="measure" aria-controls="editor-tool-measure" aria-selected="false">마디</button>
        <button type="button" role="tab" id="editor-tab-signs" data-tab="signs" aria-controls="editor-tool-signs" aria-selected="false">기호</button>
      </div>
      <div class="editor-tools" id="editor-tools">
        <div class="editor-tool" id="editor-tool-notes" role="tabpanel" aria-labelledby="editor-tab-notes" data-tab="notes"></div>
        <div class="editor-tool" id="editor-tool-measure" role="tabpanel" aria-labelledby="editor-tab-measure" data-tab="measure" hidden></div>
        <div class="editor-tool" id="editor-tool-signs" role="tabpanel" aria-labelledby="editor-tab-signs" data-tab="signs" hidden></div>
      </div>
      <div class="staff-controls editor-actions">
        <button type="button" class="btn btn-danger" id="editor-delete">삭제</button>
        <button type="button" class="btn" id="editor-cancel">취소</button>
        <button type="button" class="btn btn-primary" id="editor-save">저장</button>
      </div>
    </section>

    <section class="panel practice" aria-labelledby="playback-title">
      <h2 id="playback-title">듣기</h2>
      <div class="playback">
        <button type="button" class="btn" id="btn-tonic">기준음(도) 듣기</button>
        <button type="button" class="btn btn-primary" id="btn-question">문제 듣기</button>
        <button type="button" class="btn" id="btn-replay">다시 듣기</button>
        <button type="button" class="btn" id="btn-arpeggio" hidden>펼쳐 듣기</button>
      </div>
    </section>

    <section class="panel practice" aria-labelledby="staff-title">
      <h2 id="staff-title">받아 적기</h2>
      <p class="staff-hint" id="staff-hint" aria-live="polite"></p>
      <div class="staff-area" id="staff-area"></div>
      <div class="staff-area score-input-area" id="score-input" hidden></div>
      <div class="staff-area rhythm-area" id="rhythm-area" hidden></div>
      <div class="note-preview" id="note-preview" aria-live="polite"></div>
      <p class="note-preview rhythm-progress" id="rhythm-progress" aria-live="polite" hidden></p>
      <div class="staff-controls">
        <div class="accidentals" id="accidentals" role="group" aria-label="임시표">
          <button type="button" class="btn-toggle" id="btn-sharp" aria-pressed="false" aria-label="샵(#)">♯&#xFE0E;</button>
          <button type="button" class="btn-toggle" id="btn-flat" aria-pressed="false" aria-label="플랫(♭)">♭&#xFE0E;</button>
        </div>
        <!-- 내 악보: ♯/♭/♮ instead of the key signature's accidental. -->
        <div class="accidentals" id="score-accidentals" role="group" aria-label="임시표" hidden>
          <button type="button" class="btn-toggle" id="score-sharp" aria-pressed="false" aria-label="샵(#)">♯&#xFE0E;</button>
          <button type="button" class="btn-toggle" id="score-flat" aria-pressed="false" aria-label="플랫(♭)">♭&#xFE0E;</button>
          <button type="button" class="btn-toggle" id="score-natural" aria-pressed="false" aria-label="제자리표(♮)">♮&#xFE0E;</button>
        </div>
        <div class="rhythm-controls" id="rhythm-controls" hidden>
          <div class="time-signatures" id="time-signatures" role="radiogroup" aria-label="박자표" hidden></div>
          <div class="note-buttons" id="note-buttons" role="group" aria-label="음표"></div>
        </div>
        <button type="button" class="btn" id="btn-undo">마지막 음 지우기</button>
        <button type="button" class="btn" id="btn-clear">전체 지우기</button>
        <button type="button" class="btn btn-primary" id="btn-submit">제출</button>
      </div>
    </section>

    <section class="panel practice" aria-labelledby="result-title">
      <h2 id="result-title">결과</h2>
      <div class="result-area" id="result-area">
        <p class="placeholder">제출하면 채점 결과가 여기에 표시됩니다.</p>
      </div>
    </section>
  </main>

  <script src="js/staff.js"></script>
  <script src="js/data/instruments/piano.js"></script>
  <script src="js/sampler.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data/patterns.js"></script>
  <script src="js/data/chords.js"></script>
  <script src="js/rhythm.js"></script>
  <script src="js/data/rhythms.js"></script>
  <script src="js/notation.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/data/examples.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/sheet.js"></script>
  <script src="js/score-input.js"></script>
  <script src="js/unzip.js"></script>
  <script src="js/musicxml.js"></script>
  <script src="js/editing.js"></script>
  <script src="js/score-editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
