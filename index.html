<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen to the world</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" data-mode="melody">
    <header class="app-header">
      <h1>Listen to the world</h1>
      <p class="subtitle" id="subtitle">기준음을 듣고, 멜로디를 오선에 받아 적어 보세요.</p>
    </header>

    <div class="mode-tabs" role="tablist" aria-label="연습 모드">
      <button type="button" class="mode-tab" role="tab" aria-selected="true" data-mode="melody">멜로디</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="harmony">화성</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="rhythm">리듬</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="score">내 악보</button>
    </div>

    <section class="panel" aria-labelledby="difficulty-title">
      <div class="panel-head">
        <h2 id="difficulty-title">난이도</h2>
        <div class="chord-types" role="radiogroup" aria-label="화음 종류" id="chord-types" hidden>
          <button type="button" class="chord-type" role="radio" aria-checked="true" data-type="triad">3화음</button>
          <button type="button" class="chord-type" role="radio" aria-checked="false" data-type="seventh">7화음</button>
        </div>
        <p class="score-notice" id="score-notice" role="status" hidden></p>
      </div>
      <div class="level-area">
        <div class="difficulty" role="radiogroup" aria-label="난이도 선택">
          <button type="button" class="difficulty-option" role="radio" aria-checked="true" data-level="easy">
            <span class="difficulty-name">쉬움</span>
            <span class="difficulty-desc">3~4음</span>
          </button>
          <button type="button" class="difficulty-option" role="radio" aria-checked="false" data-level="medium">
            <span class="difficulty-name">중간</span>
            <span class="difficulty-desc">5~6음</span>
          </button>
          <button type="button" class="difficulty-option" role="radio" aria-checked="false" data-level="hard">
            <span class="difficulty-name">어려움</span>
            <span class="difficulty-desc">7~8음</span>
          </button>
        </div>
        <!-- 내 악보: drawn over the difficulty buttons, which stay in place (invisible) to keep the panel's height. -->
        <div class="score-picker" id="score-picker" hidden>
          <div class="score-row">
            <select class="score-select" id="score-select" aria-label="악보 고르기"></select>
            <button type="button" class="btn btn-small" id="btn-new-score">새 악보</button>
            <button type="button" class="btn btn-small" id="btn-edit-score">편집</button>
          </div>
          <div class="section-chips" id="section-chips" role="radiogroup" aria-label="구간"></div>
        </div>
      </div>
    </section>

    <!-- 내 악보 editor: takes the place of the listening, writing and result panels while open. -->
    <section class="panel editor" id="editor" aria-labelledby="editor-heading" hidden>
      <h2 id="editor-heading">악보 편집</h2>
      <div class="editor-meta">
        <label class="editor-title">
          <span class="editor-label">제목</span>
          <input type="text" id="editor-title" maxlength="30" placeholder="악보 제목 (30자까지)" autocomplete="off">
        </label>
        <div class="time-signatures" id="editor-times" role="radiogroup" aria-label="박자표"></div>
      </div>
      <p class="editor-hint">같은 마디라도 올리거나 내린 음은 ♯/♭을 켜고 찍으세요. 못갖춘마디는 앞을 쉼표로 채우세요.</p>
      <div class="note-buttons editor-lengths" id="editor-lengths" role="group" aria-label="음 길이"></div>
      <div class="staff-area editor-pad" id="editor-pad"></div>
      <div class="staff-controls editor-tools">
        <div class="accidentals" role="group" aria-label="임시표">
          <button type="button" class="btn-toggle" id="editor-sharp" aria-pressed="false" aria-label="샵(#)">♯&#xFE0E;</button>
          <button type="button" class="btn-toggle" id="editor-flat" aria-pressed="false" aria-label="플랫(♭)">♭&#xFE0E;</button>
        </div>
        <button type="button" class="btn" id="editor-undo">마지막 음 지우기</button>
        <button type="button" class="btn" id="editor-clear">전체 지우기</button>
      </div>
      <p class="note-preview rhythm-progress" id="editor-progress" aria-live="polite"></p>
      <div class="staff-area score-area" id="editor-view"></div>
      <div class="staff-controls editor-actions">
        <button type="button" class="btn btn-danger" id="editor-delete">삭제</button>
        <button type="button" class="btn" id="editor-cancel">취소</button>
        <button type="button" class="btn btn-primary" id="editor-save">저장</button>
      </div>
    </section>

    <section class="panel practice" aria-labelledby="playback-title">
      <h2 id="playback-title">듣기</h2>
      <div class="playback">
        <button type="button" class="btn" id="btn-tonic">기준음(도) 듣기</button>
        <button type="button" class="btn btn-primary" id="btn-question">문제 듣기</button>
        <button type="button" class="btn" id="btn-replay">다시 듣기</button>
        <button type="button" class="btn" id="btn-arpeggio" hidden>펼쳐 듣기</button>
      </div>
    </section>

    <section class="panel practice" aria-labelledby="staff-title">
      <h2 id="staff-title">받아 적기</h2>
      <p class="staff-hint" id="staff-hint" aria-live="polite"></p>
      <div class="staff-area" id="staff-area"></div>
      <div class="staff-area rhythm-area" id="rhythm-area" hidden></div>
      <div class="note-preview" id="note-preview" aria-live="polite"></div>
      <p class="note-preview rhythm-progress" id="rhythm-progress" aria-live="polite" hidden></p>
      <div class="staff-controls">
        <div class="accidentals" id="accidentals" role="group" aria-label="임시표">
          <button type="button" class="btn-toggle" id="btn-sharp" aria-pressed="false" aria-label="샵(#)">♯&#xFE0E;</button>
          <button type="button" class="btn-toggle" id="btn-flat" aria-pressed="false" aria-label="플랫(♭)">♭&#xFE0E;</button>
        </div>
        <div class="rhythm-controls" id="rhythm-controls" hidden>
          <div class="time-signatures" id="time-signatures" role="radiogroup" aria-label="박자표" hidden></div>
          <div class="note-buttons" id="note-buttons" role="group" aria-label="음표"></div>
        </div>
        <button type="button" class="btn" id="btn-undo">마지막 음 지우기</button>
        <button type="button" class="btn" id="btn-clear">전체 지우기</button>
        <button type="button" class="btn btn-primary" id="btn-submit">제출</button>
      </div>
    </section>

    <section class="panel practice" aria-labelledby="result-title">
      <h2 id="result-title">결과</h2>
      <div class="result-area" id="result-area">
        <p class="placeholder">제출하면 채점 결과가 여기에 표시됩니다.</p>
      </div>
    </section>
  </main>

  <script src="staff.js"></script>
  <script src="audio.js"></script>
  <script src="patterns.js"></script>
  <script src="chords.js"></script>
  <script src="rhythm.js"></script>
  <script src="rhythms.js"></script>
  <script src="scores.js"></script>
  <script src="score.js"></script>
  <script src="app.js"></script>
</body>
</html>
